<script>
'use strict';
const races=JSON.parse(document.getElementById('race-data').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=d=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
const longDate=d=>new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
const time=ms=>{const minutes=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,milli=String(ms%1000).padStart(3,'0');return minutes?`${minutes}:${String(s).padStart(2,'0')},${milli}`:`${s},${milli}`;};
const order=(a,b)=>a.best-b.best||a.name.localeCompare(b.name,'de');
const totalLaps=races.reduce((n,r)=>n+r.drivers.reduce((s,d)=>s+d.laps.length,0),0);
const days=[...new Set(races.map(r=>r.date))];
const bestByDriver=new Map();
for(const race of races)for(const d of race.drivers){const prev=bestByDriver.get(d.name);if(!prev||d.best<prev.best||d.best===prev.best&&(race.date+race.time)<(prev.race.date+prev.race.time))bestByDriver.set(d.name,{...d,race});}
const allTime=[...bestByDriver.values()].sort(order);
document.getElementById('days').innerHTML=days.map(day=>{const sessions=races.filter(r=>r.date===day).sort((a,b)=>a.time.localeCompare(b.time));return `<details data-day="${day}"><summary>${date(day)}<small>${sessions.length} ${sessions.length===1?'Session':'Sessions'}</small></summary><div class="sessions">${sessions.map(r=>`<a class="session-link" href="#session/${r.id}" data-session="${r.id}"><span>${esc(r.name)}</span><time>${r.time}</time></a>`).join('')}</div></details>`;}).join('');
document.getElementById('archive-info').textContent=`${days.length} Renntage · ${races.length} Sessions · ${totalLaps} Einzelrunden`;
const rank=(drivers,i)=>i===0||drivers[i].best!==drivers[i-1].best?i+1:rank(drivers,i-1);
const table=(headers,body,cls='')=>`<div class="table-scroll" tabindex="0" role="region" aria-label="${cls==='laps'?'Einzelrunden aller Fahrer':'Bestenliste'}"><table class="${cls}"><thead><tr>${headers.map((h,i)=>`<th scope="col"${i===2?' class="numeric"':''}>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
function home(){
 document.title='Ewige Bestenliste · Powerhall';
 return `<div class="heading"><div><div class="eyebrow">Alle Renntage</div><h1>Ewige Bestenliste</h1><p class="sub">Die persönliche Bestzeit jedes Fahrers. Schnellste zuerst.</p></div><span class="count">${allTime.length} Fahrer</span></div><div class="stats"><div class="stat record"><span>Streckenbestzeit im Archiv</span><strong>${time(allTime[0].best)} <span>s</span></strong></div><div class="stat"><span>Sessions</span><strong>${races.length}</strong></div><div class="stat"><span>Einzelrunden</span><strong>${totalLaps}</strong></div></div><section class="panel" aria-labelledby="ranking-title"><div class="panel-head"><h2 id="ranking-title">Gesamtwertung</h2><span>Bestzeiten aus der Ergebnisliste</span></div>${table(['Platz','Fahrer','Bestzeit','Gefahren am'],allTime.map((d,i)=>`<tr class="${d.best===allTime[0].best?'winner':''}"><td class="rank"><b>${rank(allTime,i)}</b></td><td class="driver">${esc(d.name)}</td><td class="numeric time">${time(d.best)}</td><td><a class="race-ref" href="#session/${d.race.id}">${date(d.race.date)}<small>${esc(d.race.name)} · ${d.race.time} Uhr</small></a></td></tr>`).join(''))}</section><p class="footnote">Zeiten unter einer Minute in Sekunden, längere Zeiten als Minuten:Sekunden. Bei gleicher Bestzeit teilen sich Fahrer den Rang.</p>`;
}
function session(r){
 const drivers=[...r.drivers].sort(order),fastest=drivers[0].best,maxLaps=Math.max(...drivers.map(d=>d.laps.length)),notes=drivers.filter(d=>d.note);
 document.title=`${r.name} · ${date(r.date)} · Powerhall`;
 return `<a class="back" href="#">← Ewige Bestenliste</a><div class="heading"><div><div class="eyebrow">${longDate(r.date)}</div><h1>${esc(r.name)} <span class="secondary">/ ${r.time} Uhr</span></h1><p class="sub">Kartbahn · SR5</p></div><span class="count">${drivers.length} Fahrer</span></div><div class="stats"><div class="stat record"><span>Session-Bestzeit</span><strong>${time(fastest)} <span>s</span></strong></div><div class="stat"><span>Bestzeit gefahren von</span><strong style="font-size:18px;letter-spacing:0">${drivers.filter(d=>d.best===fastest).map(d=>esc(d.name)).join(' · ')}</strong></div><div class="stat"><span>Erfasste Runden</span><strong>${drivers.reduce((s,d)=>s+d.laps.length,0)}</strong></div></div>${notes.map(d=>`<div class="warning"><strong>Hinweis zu ${esc(d.name)}:</strong> Die Ergebnisliste nennt ${time(d.best)} s. Die schnellste der ${d.laps.length} sichtbaren Einzelrunden beträgt ${time(Math.min(...d.laps))} s. Diese Abweichung ist bereits in der Powerhall-App vorhanden.</div>`).join('')}<section class="panel" aria-labelledby="session-ranking"><div class="panel-head"><h2 id="session-ranking">Bestzeiten der Session</h2><span>Schnellste zuerst</span></div>${table(['Platz','Fahrer','Bestzeit','Runden'],drivers.map((d,i)=>`<tr class="${d.best===fastest?'winner':''}"><td class="rank"><b>${rank(drivers,i)}</b></td><td class="driver">${esc(d.name)}${d.note?'<span class="note-mark" title="Abweichung zwischen Ergebnisliste und Einzelrunden">*</span>':''}</td><td class="numeric time">${time(d.best)}</td><td class="secondary">${d.laps.length}</td></tr>`).join(''))}</section><section class="panel" aria-labelledby="lap-title"><div class="panel-head"><h2 id="lap-title">Alle Einzelrunden</h2><span>Fahrer nach Bestzeit sortiert</span></div>${table(['Runde',...drivers.map(d=>esc(d.name))],Array.from({length:maxLaps},(_,i)=>`<tr><th scope="row">${String(i+1).padStart(2,'0')}</th>${drivers.map(d=>{const v=d.laps[i];return `<td class="time ${v===fastest?'session-best':v===Math.min(...d.laps)?'personal':''}">${v===undefined?'<span class="secondary" aria-label="Keine Runde verfügbar">—</span>':time(v)}</td>`;}).join('')}</tr>`).join(''),'laps')}<div class="legend"><span><i class="swatch best" aria-hidden="true"></i>Session-Bestzeit</span><span><i class="swatch" aria-hidden="true"></i>Schnellste erfasste Runde des Fahrers</span><span>— Keine Runde verfügbar</span></div></section><p class="footnote">Rundennummern entsprechen der Reihenfolge der sichtbaren Punkte im Powerhall-Diagramm. Auf schmalen Bildschirmen lässt sich die Rundentabelle seitlich scrollen.</p>`;
}
function render(){
 const id=location.hash.startsWith('#session/')?location.hash.slice(9):null,r=races.find(r=>r.id===id);
 document.getElementById('content').innerHTML=r?session(r):home();
 document.getElementById('home-link').setAttribute('aria-current',r?'false':'page');
 document.querySelectorAll('[data-session]').forEach(a=>a.setAttribute('aria-current',a.dataset.session===r?.id?'page':'false'));
 if(r)document.querySelector(`[data-day="${r.date}"]`).open=true;
}
window.addEventListener('hashchange',()=>{render();document.getElementById('content').focus({preventScroll:true});document.getElementById('content').scrollIntoView({block:'start'});});
render();
</script>
